 <script>
      function showHidePassword(element) {
        const passwordInput = document.querySelector('input[name="password"]');
        const eyeIcon = element.querySelector("i");

        if (passwordInput.type === "password") {
          passwordInput.type = "text";
          eyeIcon.classList.remove("fa-eye-slash");
          eyeIcon.classList.add("fa-eye");
        } else {
          passwordInput.type = "password";
          eyeIcon.classList.remove("fa-eye");
          eyeIcon.classList.add("fa-eye-slash");
        }
      }

      function validasiNik(input) {
        var nik = $(input).val();
        var validasiNikElement = $("#validasiNik");

        // Regular expression to match exactly 16 digits
        var nikRegex = /^[0-9]{16}$/;

        if (!nikRegex.test(nik)) {
          validasiNikElement.text("NO KK harus terdiri dari 16 digit angka");
          $(input).addClass("is-invalid");

          // Restricts input for the set of matched elements to the given inputFilter.
          $(input).on("input", function (event) {
            this.value = this.value.replace(/[^0-9]/g, "");
          });
        } else {
          validasiNikElement.text("");
          $(input).removeClass("is-invalid");
        }
      }

      $('input[name="nik"]').on("keyup", function () {
        validasiNik(this);
      });
      document.addEventListener("DOMContentLoaded", function () {
        let menuItems = document.querySelectorAll(
          ".main-menu .navigation > li",
        );

        menuItems.forEach((item) => {
          item.addEventListener("mouseenter", function () {
            // Tutup semua submenu lain kecuali yang sedang di-hover
            menuItems.forEach((otherItem) => {
              if (otherItem !== item) {
                let submenu = otherItem.querySelector("ul");
                if (submenu) submenu.style.display = "none";
              }
            });

            // Buka submenu utama yang sedang di-hover
            let submenu = item.querySelector("ul");
            if (submenu) submenu.style.display = "block";

            // Tutup sub-submenu lain jika ada
            let subSubMenus = document.querySelectorAll(
              ".main-menu .navigation ul ul",
            );
            subSubMenus.forEach((sub) => (sub.style.display = "none"));
          });

          // Tambahkan event untuk sub-submenu
          let subMenuItems = item.querySelectorAll("ul > li");
          subMenuItems.forEach((subItem) => {
            subItem.addEventListener("mouseenter", function () {
              let subSubMenu = subItem.querySelector("ul");
              if (subSubMenu) {
                subSubMenu.style.display = "block";
              }
            });

            subItem.addEventListener("mouseleave", function () {
              let subSubMenu = subItem.querySelector("ul");
              if (subSubMenu) {
                subSubMenu.style.display = "none";
              }
            });
          });
        });

        // Tutup semua submenu saat mouse keluar dari menu utama
        document
          .querySelector(".main-menu")
          .addEventListener("mouseleave", function () {
            menuItems.forEach((item) => {
              let submenu = item.querySelector("ul");
              if (submenu) submenu.style.display = "none";
            });
          });
      });

      $(document).on("click", ".btn-registrasi", function () {
        var form = $("#form-registrasi");
        var url = form.attr("action");
        var type = form.attr("method");
        var formData = new FormData($("#form-registrasi")[0]);
        $.ajax({
          type: type,
          url: url,
          data: formData,
          enctype: "multipart/form-data",
          dataType: "json",
          processData: false,
          contentType: false,
          beforeSend: function () {
            $(".btn-registrasi").html("Menyimpan..");
            $(".btn-registrasi").attr("disabled", true);
          },
          success: function (data) {
            $(".btn-registrasi").html("Simpan");
            $(".btn-registrasi").removeAttr("disabled");
            if (data.status) {
              Swal.fire({
                title: "Success",
                text: data.text,
                icon: "success",
                confirmButtonText: "Tutup",
              }).then((result) => {
                if (result.isConfirmed) {
                  if (data.url) {
                    var isValidUrl = function (url) {
                      try {
                        new URL(url);
                        return true;
                      } catch (_) {
                        return false;
                      }
                    };
                    if (isValidUrl(data.url)) {
                      window.location.href = data.url;
                    } else {
                      console.error("Invalid URL");
                    }
                  } else {
                    $("#modal").modal("hide");
                    $(".modal-backdrop").remove();
                  }
                }
              });
            } else {
              if (data.errors) {
                var er = data.errors;
                $.each(er, function (index, item) {
                  $("#" + index.replace("[]", "")).addClass("is-invalid");
                  $("#" + index.replace("[]", "") + "label").html(item);
                  $("#" + index.replace("[]", "") + "label").show();
                });
              } else {
                Swal.fire({
                  title: "Error!",
                  text: data.text,
                  icon: "error",
                  confirmButtonText: "Tutup",
                });
              }
            }
          },
          error: function (xhr) {
            $(".btn-submit").html("Simpan");
            $(".btn-submit").removeAttr("disabled");
            let message = "";
            message = "";
            $.each(xhr.responseJSON.errors, function (index, item) {
              message += item + "<br>";
            });
            Swal.fire({
              title: "Error!",
              html: message.trim(),
              icon: "error",
              confirmButtonText: "Tutup",
            });
          },
        });
      });

    <script>
      document.addEventListener("DOMContentLoaded", function () {
        function updateHeaderClock() {
          const now = new Date();
          const days = [
            "Minggu",
            "Senin",
            "Selasa",
            "Rabu",
            "Kamis",
            "Jumat",
            "Sabtu",
          ];
          const months = [
            "Jan",
            "Feb",
            "Mar",
            "Apr",
            "Mei",
            "Jun",
            "Jul",
            "Agus",
            "Sep",
            "Okt",
            "Nov",
            "Des",
          ];
          const dayName = days[now.getDay()];
          const day = now.getDate();
          const monthName = months[now.getMonth()];
          const year = now.getFullYear();
          const hours = String(now.getHours()).padStart(2, "0");
          const minutes = String(now.getMinutes()).padStart(2, "0");
          const seconds = String(now.getSeconds()).padStart(2, "0");

          const clockEl = document.getElementById("header-live-date");
          if (clockEl) {
            clockEl.innerHTML = `${dayName}, ${day} ${monthName} ${year} • ${hours}:${minutes}:${seconds} WIB`;
          }
        }
        updateHeaderClock();
        // Header elevation shadow & contraction on scroll
        window.addEventListener("scroll", function () {
          const header = document.querySelector(".main-header");
          if (header) {
            if (window.scrollY > 25) {
              header.classList.add("header-scrolled");
            } else {
              header.classList.remove("header-scrolled");
            }
          }
        });

        // Smooth Submenu & Sub-Submenu Click & Hover Toggle Logic
        const allDropdowns = document.querySelectorAll(
          ".main-menu .navigation li.dropdown",
        );
        allDropdowns.forEach(function (parent) {
          const link = parent.querySelector(":scope > a");
          if (link) {
            link.addEventListener("click", function (e) {
              const href = this.getAttribute("href");
              const childUl = parent.querySelector(":scope > ul");
              if (childUl) {
                if (!href || href === "#" || href === "javascript:void(0)") {
                  e.preventDefault();
                }
                const isOpen = parent.classList.contains("open");
                if (parent.parentElement) {
                  parent.parentElement
                    .querySelectorAll(":scope > li.dropdown")
                    .forEach((el) => {
                      if (el !== parent) el.classList.remove("open");
                    });
                }
                if (!isOpen) {
                  parent.classList.add("open");
                } else {
                  parent.classList.remove("open");
                }
              }
            });
          }
        });

        document.addEventListener("click", function (e) {
          if (!e.target.closest(".main-menu .navigation")) {
            allDropdowns.forEach((el) => el.classList.remove("open"));
          }
        });
      });
    </script>

    <script>
      let articleId = 2747;

      $(document).ready(function () {
        loadComments();
      });

      function loadComments() {
        $.ajax({
          url: "https://melung.desa.id/artikel/komentar",
          type: "GET",
          data: {
            artikel_id: articleId,
          },
          success: function (data) {
            $("#comment-list").html("");
            if (data && data.length > 0) {
              data.forEach((comment) => {
                $("#comment-list").append(renderComment(comment));
              });
            } else {
              $("#comment-list").html(
                '<p class="text-muted text-center my-4" style="font-size: 14px;"><i class="far fa-comments mr-2"></i> Belum ada komentar. Jadilah yang pertama memberikan tanggapan!</p>',
              );
            }
          },
          error: function (xhr, status, error) {
            console.error("Error fetching comments:", error);
          },
        });
      }

      function addComment(parent_id = null) {
        let nama = parent_id
          ? $("#reply-nama-" + parent_id).val()
          : $("#nama_pengirim").val();
        let no_hp = parent_id
          ? $("#reply-no_telepon-" + parent_id).val()
          : $("#no_telepon").val();
        let konten = parent_id
          ? $("#reply-" + parent_id).val()
          : $("#comment").val();
        let website_url = $("#website_url").val() || "";

        let recaptchaResponse = "";
        if (typeof grecaptcha !== "undefined") {
          recaptchaResponse = grecaptcha.getResponse();
        }

        if (!recaptchaResponse) {
          alert("Silakan centang reCAPTCHA terlebih dahulu.");
          return;
        }

        $.ajax({
          url: "https://melung.desa.id/komentar",
          type: "POST",
          data: {
            konten,
            nama,
            no_hp,
            artikel_id: articleId,
            parent_id: parent_id || null,
            website_url: website_url,
            "g-recaptcha-response": recaptchaResponse,
            _token: "ED7KaUWEdrEdc01qwbXnsNctvP5iMa7zI74O4Yjb",
          },
          success: function (data) {
            let newComment = renderComment(data);
            if (parent_id) {
              $("#replies-" + parent_id).append(newComment);
              $("#reply-" + parent_id).val("");
              $("#reply-nama-" + parent_id).val("");
              $("#reply-no_telepon-" + parent_id).val("");
              $("#reply-box-" + parent_id).addClass("d-none");
            } else {
              // Remove empty state message if exists
              if ($("#comment-list").find(".comment-card").length === 0) {
                $("#comment-list").html("");
              }
              $("#comment-list").prepend(newComment);
              $("#comment").val("");
              $("#nama_pengirim").val("");
              $("#no_telepon").val("");
            }
            if (typeof grecaptcha !== "undefined") {
              grecaptcha.reset();
            }
          },
          error: function (xhr, status, error) {
            let msg = "Gagal mengirim komentar.";
            if (xhr.responseJSON) {
              if (xhr.responseJSON.message) {
                msg = xhr.responseJSON.message;
              } else if (xhr.responseJSON.errors) {
                let firstKey = Object.keys(xhr.responseJSON.errors)[0];
                if (firstKey && xhr.responseJSON.errors[firstKey][0]) {
                  msg = xhr.responseJSON.errors[firstKey][0];
                }
              }
            }
            alert(msg);
            if (typeof grecaptcha !== "undefined") {
              grecaptcha.reset();
            }
          },
        });
      }

      function formatCommentDate(dateStr) {
        if (!dateStr) return "";
        try {
          let d = new Date(dateStr);
          if (isNaN(d.getTime())) return dateStr;
          return d
            .toLocaleDateString("id-ID", {
              day: "numeric",
              month: "short",
              year: "numeric",
              hour: "2-digit",
              minute: "2-digit",
            })
            .replace(".", ":");
        } catch (e) {
          return dateStr;
        }
      }

      function renderComment(comment) {
        let repliesHtml = "";
        if (comment.replies && comment.replies.length > 0) {
          comment.replies.forEach((reply) => {
            repliesHtml += renderComment(reply);
          });
        }

        let formattedDate = formatCommentDate(comment.created_at);
        let initial = comment.nama
          ? comment.nama.trim().charAt(0).toUpperCase()
          : "U";

        return `
				<div class="comment-card" id="comment-${comment.id}">
					<div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;">
						<div style="display: flex; align-items: center; gap: 12px;">
							<div class="comment-avatar">${initial}</div>
							<div>
								<div class="comment-author-name">${comment.nama || "Pengunjung"}</div>
								<div class="comment-date-badge">
									<i class="far fa-clock"></i> ${formattedDate}
								</div>
							</div>
						</div>
						<button type="button" class="btn-reply-custom" onclick="toggleReplyBox(${comment.id})">
							<i class="fas fa-reply"></i> Balas
						</button>
					</div>
					
					<div class="comment-body-text">${comment.konten || ""}</div>
					
					<!-- Reply Form Box -->
					<div class="reply-form-container d-none" id="reply-box-${comment.id}">
						<div style="font-weight: 700; font-size: 13px; color: #065f46; margin-bottom: 8px;">
							<i class="fas fa-reply mr-1"></i> Balas Komentar ${comment.nama ? "ke " + comment.nama : ""}
						</div>
						<textarea class="form-control mb-2" id="reply-${comment.id}" rows="2" placeholder="Tulis balasan Anda..." style="border-radius: 10px; background: #ffffff; font-size: 13.5px; border: 1px solid #cbd5e1;"></textarea>
						<div class="row g-2 mb-2">
							<div class="col-md-6 mb-2">
								<input class="form-control" id="reply-nama-${comment.id}" type="text" placeholder="Nama Anda" style="border-radius: 10px; background: #ffffff; font-size: 13px; border: 1px solid #cbd5e1;">
							</div>
							<div class="col-md-6 mb-2">
								<input class="form-control" id="reply-no_telepon-${comment.id}" type="tel" inputmode="numeric" oninput="this.value = this.value.replace(/[^0-9]/g, '')" placeholder="No. HP / WA (Hanya Angka)" style="border-radius: 10px; background: #ffffff; font-size: 13px; border: 1px solid #cbd5e1;">
							</div>
						</div>
						<div style="display: flex; gap: 8px; justify-content: flex-end;">
							<button type="button" class="btn btn-sm btn-light" style="border-radius: 8px; font-size: 12.5px;" onclick="toggleReplyBox(${comment.id})">Batal</button>
							<button type="button" class="btn btn-sm text-white font-weight-bold px-3" style="background: #096B68; border-radius: 8px; font-size: 12.5px;" onclick="addComment(${comment.id})">Kirim Balasan</button>
						</div>
					</div>

					${repliesHtml ? `<div class="reply-thread-box" id="replies-${comment.id}">${repliesHtml}</div>` : `<div id="replies-${comment.id}"></div>`}
				</div>
			`;
      }

      function toggleReplyBox(id) {
        $("#reply-box-" + id).toggleClass("d-none");
      }
    </script>

              $("#aduan-list").html(aduanHtml);
            },

              alert("Gagal memuat data aduan.");
            },
          });
        }

        $("#form-aduan").on("submit", function (e) {
          e.preventDefault();
          let formData = new FormData(this);
          let $btn = $("#btn-submit-aduan");
          $btn
            .prop("disabled", true)
            .html('<i class="fas fa-spinner fa-spin"></i> Mengirim...');

          $.ajax({
            url: "https://melung.desa.id/api/aduan",
            method: "POST",
            data: formData,
            processData: false,
            contentType: false,
            headers: {
              "X-CSRF-TOKEN": "ED7KaUWEdrEdc01qwbXnsNctvP5iMa7zI74O4Yjb",
            },
            success: function (response) {
              $btn.prop("disabled", false).html("Tambah Aduan");
              Swal.fire({
                title: "Berhasil!",
                text: "Aduan Anda berhasil dikirim.",
                icon: "success",
                confirmButtonText: "Tutup",
              }).then(() => {
                $("#modal-aduan").modal("hide");
                $("#form-aduan")[0].reset();
                loadAduan();
              });
            },
            error: function (xhr) {
              $btn.prop("disabled", false).html("Tambah Aduan");
              let errorMessage = "Gagal menambahkan aduan.";
              if (xhr.responseJSON && xhr.responseJSON.text) {
                errorMessage = xhr.responseJSON.text;
              } else if (xhr.status === 419) {
                errorMessage = "Sesi habis, silakan muat ulang halaman.";
              }
              Swal.fire({
                title: "Gagal",
                text: errorMessage,
                icon: "error",
                confirmButtonText: "Tutup",
              });
            },
          });
        });

        $(document).ready(function () {
          console.log("Document is ready");

          loadAduan();
        });
      });
    </script>
